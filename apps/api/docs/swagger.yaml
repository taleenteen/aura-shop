            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: INSUFFICIENT_STOCK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Change a bag line quantity
      tags:
      - Cart
  /catalog:
    get:
      description: Returns one page of active products matching the filters. meta
        carries pagination (page, limit, total_items, total_pages) and meta.facets
        carries dto.FacetCounts for the current filters.
      parameters:
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Brand slug
        in: query
        name: brand
        type: string
      - description: Persona filter
        in: query
        name: persona
        type: string
      - description: CPU family
        in: query
        name: cpu
        type: string
      - description: RAM in GB
        in: query
        name: ram
        type: integer
      - description: Storage in GB
        in: query
        name: storage
        type: integer
      - description: Minimum price in satang
        in: query
        name: min_price
        type: integer
      - description: Maximum price in satang
        in: query
        name: max_price
        type: integer
      - description: Sort order; newest first when omitted
        enum:
        - price_asc
        - price_desc
        in: query
        name: sort
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 12
        description: Page size (max 100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Product'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List catalog products
      tags:
      - Catalog
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Category'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List categories
      tags:
      - Catalog
  /checkout/installments/{satangAmount}:
    get:
      description: Returns the monthly payment for each supported bank and term (3,
        6 or 10 months) for the given amount.
      parameters:
      - description: Amount in satang (greater than 0)
        in: path
        name: satangAmount
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.InstallmentCalculationOption'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Calculate 0% installment options
      tags:
      - Checkout
  /checkout/pay:
    post:
      consumes:
      - application/json
      description: |-
        Processes the simulated payment for a PENDING_PAYMENT order placed by the same customer or guest session. On success the reserved stock is committed,
        the order moves to PAID_PROCESSING and the order-confirmation email is written. Card numbers ending in 0000 are declined (402) and the reservation is kept.
        INSTALLMENT_0 requires `installment_plan` with bank KBANK, SCB, KRUNGSRI or BBL and 3, 6 or 10 months.
      parameters:
      - description: One key per attempt; a retry with the same key replays the first
          response instead of running again
        in: header
        name: Idempotency-Key
        type: string
      - description: Order number, payment method and card or installment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PaymentProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Order'
              type: object
        "400":
          description: 'BAD_REQUEST: invalid body, missing order_number, unsupported
            method, invalid installment plan or order not payable'
          schema:
            $ref: '#/definitions/response.Envelope'
        "402":
          description: CARD_DECLINED_INSUFFICIENT_FUNDS
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Order not found or not placed by this customer
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: RESERVATION_EXPIRED
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: 'IDEMPOTENCY_KEY_REUSED: the key was used for a different request'
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Pay for a reserved order
      tags:
      - Checkout
  /checkout/promptpay/{orderNumber}:
    get:
      description: Returns the PromptPay payload and a QR code image (data URL) for
        the order total. Only the customer or guest session that placed the order
        may request it.
      parameters:
      - description: Order number
        in: path
        name: orderNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.PromptPayQRResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Order not found or not placed by this customer
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Get the PromptPay QR for an order
      tags:
      - Checkout
  /checkout/reserve:
    post:
      consumes:
      - application/json
      description: |-
        Turns the current bag (of the signed-in customer, or of the guest session) into a PENDING_PAYMENT order and holds its stock for 15 minutes.
        When signed in and `customer_email` is empty, the account email is used. Pay with POST /checkout/pay before the reservation expires.
      parameters:
      - description: One key per attempt; a retry with the same key replays the first
          response instead of running again
        in: header
        name: Idempotency-Key
        type: string
      - description: Contact email, shipping address and payment method (PROMPTPAY_QR,
          CREDIT_CARD, INSTALLMENT_0)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CheckoutReserveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.CheckoutReserveResponse'
              type: object
        "400":
          description: BAD_REQUEST (invalid body or empty bag) or VALIDATION_FAILED
            (error.fields.customer_email)
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: PRODUCT_UNAVAILABLE or INSUFFICIENT_STOCK
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: 'IDEMPOTENCY_KEY_REUSED: the key was used for a different request'
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Reserve the bag and open an order
      tags:
      - Checkout
  /orders/{orderNumber}:
    get:
      description: |-
        Returns the order with its items. Visible to the customer or guest session that placed it, to admins, and to anyone sending the order email in `X-Order-Email`.
        `viewer_can_manage` is true only for the customer or guest session that placed it. Orders the requester may not see return 404.
      parameters:
      - description: Order number
        in: path
        name: orderNumber
        required: true
        type: string
      - description: Email the order was placed with (from an order lookup)
        in: header
        name: X-Order-Email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Get an order
      tags:
      - Orders
  /orders/{orderNumber}/cancel:
    post:
      description: Lets the customer or guest session that placed a PENDING_PAYMENT
        order cancel it, releasing its reserved stock.
      parameters:
      - description: Order number
        in: path
        name: orderNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Order'
              type: object
        "404":
          description: Order not found or not placed by this customer
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: ORDER_NOT_CANCELLABLE (already paid or already cancelled)
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Cancel an unpaid order
      tags:
      - Orders
  /orders/{orderNumber}/emails:
    get:
      description: |-
        Returns the emails sent to the customer about the order (confirmation, shipping and so on), newest first.
        Same visibility as GET /orders/{orderNumber}: the customer or guest session that placed it, admins, or a matching `X-Order-Email`.
      parameters:
      - description: Order number
        in: path
        name: orderNumber
        required: true
        type: string
      - description: Email the order was placed with (from an order lookup)
        in: header
        name: X-Order-Email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.EmailMessage'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: List emails sent about an order
      tags:
      - Orders
  /orders/lookup:
    post:
      consumes:
      - application/json
      description: |-
        Finds an order by its number and the email it was placed with, for customers who checked out as guests or on another device.
        `viewer_can_manage` is true only when the requester also placed the order.
      parameters:
      - description: Order number and email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OrderLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Order'
              type: object
        "400":
          description: BAD_REQUEST (invalid body) or VALIDATION_FAILED (error.fields.order_number,
            error.fields.email)
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: No order with that number and email
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Look up an order by number and email
      tags:
      - Orders
  /products/{slug}:
    get:
      description: Returns an active product with its category, brand, variants and
        accessory bundles.
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Product'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get a product
      tags:
      - Catalog
  /products/{slug}/reviews:
    get:
      description: Returns the rating summary and one page of visible reviews. When
        signed in, data.viewer says whether the customer can review the product and
        includes their own review (even if hidden); it is null for guests. meta carries
        pagination (page, limit, total_items, total_pages).
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 5
        description: Page size (max 20)
        in: query
        maximum: 20
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductReviews'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List a product's reviews
      tags:
      - Reviews
  /products/{slug}/reviews/mine:
    delete:
      description: 'Returns `{ "message": string }`.'
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Product or review not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete my review
      tags:
      - Reviews
    put:
      consumes:
      - application/json
      description: 'Creates or replaces the signed-in customer''s review. Allowed
        only after an order containing the product has been delivered. Rating 1 to
        5, title up to 120 characters, body up to 2,000 characters. Returns `{ "message":
        string }`.'
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      - description: Review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReviewInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: VALIDATION_FAILED with per-field error.fields, or invalid body
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: REVIEW_NOT_ALLOWED
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Write or update my review
      tags:
      - Reviews
  /products/compare:
    get:
      description: Returns the active products for the given slugs; unknown or inactive
        slugs are left out.
      parameters:
      - description: Comma-separated product slugs
        in: query
        name: slugs
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Product'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Compare products
      tags:
      - Catalog
  /search:
    get:
      description: 'Matches product and variant names; returns up to 8 active products.
        An empty query returns `data: null`.'
      parameters:
      - description: Search text
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Product'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Search products
      tags:
      - Catalog
  /wishlist:
    get:
      description: Returns the wishlist of the signed-in customer, or of the guest
        session when signed out.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Wishlist'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Get the wishlist
      tags:
      - Wishlist
  /wishlist/toggle:
    post:
      consumes:
      - application/json
      description: Adds the product when it is not saved yet, otherwise removes it.
        Returns the new state and the wishlist size.
      parameters:
      - description: Product to toggle
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.WishlistToggleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.WishlistToggleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      - GuestSession: []
      summary: Add or remove a product from the wishlist
      tags:
      - Wishlist
securityDefinitions:
  BearerAuth:
    description: JWT from /auth/login, sent as `Bearer <token>`.
    in: header
    name: Authorization
    type: apiKey
  GuestSession:
    description: Guest cart, wishlist and order session id.
    in: header
    name: X-Guest-Session-ID
    type: apiKey
swagger: "2.0"
tags:
- description: Sign up, sign in, profile and password reset. Sign-in returns the JWT
    for BearerAuth.
  name: Auth
- description: The signed-in customer's orders, emails and back-in-stock alerts.
  name: Account
- description: Categories, brands, the filtered product list, product pages, search
    and comparison.
  name: Catalog
- description: Live home-page and ribbon banners.
  name: Banners
- description: Product reviews and the signed-in customer's own review.
  name: Reviews
- description: The bag, for guests (GuestSession) or signed-in customers.
  name: Cart
- description: Saved products, for guests or signed-in customers.
  name: Wishlist
- description: Reserve stock, then pay (PromptPay, card or installments).
  name: Checkout
- description: Order status, emails, guest lookup and cancellation.
  name: Orders
- description: Backoffice dashboard figures. All Admin groups need an admin account.
  name: Admin · Overview
- name: Admin · Orders
- name: Admin · Products
- name: Admin · Stock
- name: Admin · Uploads
- name: Admin · CSV import
- name: Admin · Banners
- name: Admin · Categories
- name: Admin · Brands
- name: Admin · Reviews
- name: Admin · Reports
- name: Admin · Activity

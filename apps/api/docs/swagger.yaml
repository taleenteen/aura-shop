  /admin/variants/{id}/stock-adjustments:
    post:
      consumes:
      - application/json
      description: Changes one variant's physical stock. mode "delta" adds quantity
        (may be negative, not 0); mode "set" makes stock equal quantity (a physical
        count). reason is one of RECEIVE, COUNT, DAMAGE or RETURN; a note is required
        for COUNT and DAMAGE (max 500 characters). Pass expected_stock (the stock
        you saw) to refuse the change if stock moved since. Stock cannot go below
        zero or below units held in checkout. Every change appends to the stock ledger,
        may send back-in-stock emails to waiting customers, and is written to the
        audit log.
      parameters:
      - description: Variant ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Adjustment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.StockAdjustmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.StockAdjustmentResponse'
              type: object
        "400":
          description: Invalid id or body; INVALID_STOCK when stock would go below
            zero or below reserved units
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Variant not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: 'STOCK_CHANGED: stock differs from expected_stock'
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: 'VALIDATION_FAILED: per-field messages in error.fields (mode,
            quantity, reason, note)'
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Adjust a variant's stock
      tags:
      - Admin · Stock

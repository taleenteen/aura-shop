      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: VALIDATION_FAILED (error.fields.from or error.fields.to)
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:

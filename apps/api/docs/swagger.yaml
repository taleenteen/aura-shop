  /admin/reports/sales:
    get:
      description: |-
        Sales totals for the range (and for the same number of days just before it), a series grouped by day, week or month, and the top products, categories and payment methods.
        Dates are store dates (Thailand time), inclusive. Without `from`/`to` the report covers the last 30 days including today. Ranges are limited to 3 years; grouping by day to 400 days.
      parameters:
      - description: Start date (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: End date, inclusive (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      - default: day
        description: Series grouping
        enum:
        - day
        - week
        - month
        in: query
        name: group
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.SalesReport'
              type: object
        "400":
          description: VALIDATION_FAILED (error.fields.from, error.fields.to or error.fields.group)
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get the sales report
      tags:
      - Admin · Reports
  /admin/reports/sales/export:
    get:
      description: |-
        Downloads one row per order item of paid and refunded (cancelled after payment) orders in the range, as UTF-8 CSV with a BOM.
        Columns: order_number, date, status, refunded, customer_email, recipient, province, payment_method, sku, product, option, quantity, unit_price, line_total, order_total, carrier, tracking_number (amounts in baht).
        Same date range rules as GET /admin/reports/sales.
      parameters:
      - description: Start date (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: End date, inclusive (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      produces:

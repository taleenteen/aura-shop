  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Moves an order to a new status (only allowed transitions) and saves serial numbers per order item (one per unit; a blank entry keeps the saved serial).
        SHIPPED requires a serial for every unit plus `carrier` (KERRY, FLASH or DHL) and `tracking_number`. CANCELLED returns the order's stock (reserved and already committed).
        Moving to SHIPPED, DELIVERED or CANCELLED writes the matching customer email, and every change is recorded in the activity log.
        `data` is an object with `message` and `status` (the new status).
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New status, serial numbers and shipment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: BAD_REQUEST, SERIAL_NUMBER_REQUIRED, INVALID_SERIAL_NUMBERS,
            or VALIDATION_FAILED (error.fields.carrier or error.fields.tracking_number)
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: INVALID_ORDER_TRANSITION
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update an order's status
      tags:
      - Admin · Orders

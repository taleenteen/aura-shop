basePath: /api/v1
definitions:
  dto.AddToCartRequest:
    properties:
      bundle_accessory_variant_ids:
        items:
          type: string
        type: array
      quantity:
        type: integer
      variant_id:
        type: string
    type: object
  dto.AdminBrand:
    properties:
      id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      product_count:
        type: integer
      slug:
        type: string
    type: object
  dto.AdminCategory:
    properties:
      icon_name:
        type: string
      id:
        type: string
      name:
        type: string
      nav_label:
        type: string
      product_count:
        type: integer
      slug:
        type: string
      sort_order:
        type: integer
    type: object
  dto.AdminOverviewStats:
    properties:
      category_revenue:
        description: all paid line items, largest first
        items:
          $ref: '#/definitions/dto.CategoryRevenue'
        type: array
      daily_revenue:
        description: last 7 days, oldest first, zero-filled
        items:
          $ref: '#/definitions/dto.DailyRevenue'
        type: array
      low_stock_alerts:
        items:
          $ref: '#/definitions/dto.LowStockItem'
        type: array
      orders_by_status:
        additionalProperties:
          type: integer
        type: object
      paid_orders_count:
        type: integer
      revenue_30d_satang:
        description: last 30 days, today included
        type: integer
      revenue_prev_30d_satang:
        description: the 30 days before that
        type: integer
      total_orders_count:
        description: every status
        type: integer
      total_revenue_satang:
        description: all paid orders, all time
        type: integer
    type: object
  dto.AdminProductSummary:
    properties:
      archived_at:
        type: string
      brand_name:
        type: string
      category_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      low_stock_count:
        description: variants with <= 3 available
        type: integer
      min_price:
        type: integer
      name:
        type: string
      order_count:
        description: orders that include the product; > 0 means it cannot be deleted
        type: integer
      reserved_total:
        type: integer
      slug:
        type: string
      stock_total:
        type: integer
      thumbnail:
        type: string
      updated_at:
        type: string
      variant_count:
        type: integer
    type: object
  dto.AdminReview:
    properties:
      author_email:
        type: string
      author_name:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_hidden:
        type: boolean
      product_name:
        type: string
      product_slug:
        type: string
      rating:
        type: integer
      title:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  dto.BannerInput:
    properties:
      background_color:
        type: string
      badge_text:
        type: string
      cta_primary_link:
        type: string
      cta_primary_text:
        type: string
      cta_secondary_link:
        type: string
      cta_secondary_text:
        type: string
      end_at:
        type: string
      grid_span:
        description: 'bento tile size: large, wide or standard (see service)'
        type: string
      headline:
        type: string
      is_active:
        type: boolean
      placement:
        type: string
      product_image_url:
        type: string
      sort_order:
        type: integer
      start_at:
        type: string
      subheadline:
        type: string
      theme_mode:
        type: string
    type: object
  dto.BannerStatus:
    properties:
      is_active:
        type: boolean
    type: object
  dto.BrandInput:
    properties:
      logo_url:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  dto.CartItemDTO:
    properties:
      available_stock:
        type: integer
      color_hex:
        type: string
      color_name:
        type: string
      id:
        type: string
      images:
        type: object
      item_total:
        description: Price * Quantity in Satang
        type: integer
      price:
        description: Satang
        type: integer
      product_id:
        type: string
      product_name:
        type: string
      product_slug:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      specs:
        type: object
      variant_id:
        type: string
    type: object
  dto.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItemDTO'
        type: array
      subtotal_amount:
        description: Satang
        type: integer
      total_items:
        type: integer
    type: object
  dto.CategoryInput:
    properties:
      icon_name:
        type: string
      name:
        type: string
      nav_label:
        type: string
      slug:
        type: string
      sort_order:
        type: integer
    type: object
  dto.CategoryRevenue:
    properties:
      category:
        type: string
      revenue_satang:
        type: integer
      units:
        type: integer
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  dto.CheckoutReserveRequest:
    properties:
      customer_email:
        type: string
      installment_plan:
        $ref: '#/definitions/dto.InstallmentPlanDTO'
      payment_method:
        description: PROMPTPAY_QR, CREDIT_CARD, INSTALLMENT_0
        type: string
      shipping_address:
        $ref: '#/definitions/dto.ShippingAddressDTO'
    type: object
  dto.CheckoutReserveResponse:
    properties:
      grand_total_satang:
        type: integer
      order_number:
        type: string
      payment_method:
        type: string
      reservation_expires_at:
        type: string
    type: object
  dto.DailyRevenue:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      orders:
        type: integer
      revenue_satang:
        type: integer
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  dto.ForgotPasswordResponse:
    properties:
      email_id:
        type: string
    type: object
  dto.ImportChange:
    properties:
      current:
        type: string
      incoming:
        type: string
      key:
        description: e.g. "name", "sku:MBA13-M3-16-256-MN:price"
        type: string
      label:
        type: string
      sku:
        description: set for option-level changes
        type: string
    type: object
  dto.ImportColumn:
    properties:
      example:
        type: string
      format:
        type: string
      key:
        type: string
      label:
        type: string
      level:
        description: '"product" (same on every row of a product) or "variant"'
        type: string
      notes:
        type: string
      required_new:
        description: needed when the row creates a product or option
        type: boolean
    type: object
  dto.ImportCommitRequest:
    properties:
      csv:
        type: string
      decisions:
        additionalProperties:
          $ref: '#/definitions/dto.ImportDecision'
        description: by ImportProduct.Key
        type: object
      filename:
        type: string
    type: object
  dto.ImportDecision:
    properties:
      action:
        description: '"update" (apply to the matched product), "create" (add as a
          new product) or "skip".'
        type: string
      keep:
        description: Change keys (see ImportChange.Key) to leave as they are in the
          store.
        items:
          type: string
        type: array
    type: object
  dto.ImportIssue:
    properties:
      column:
        type: string
      message:
        type: string
      row:
        type: integer
    type: object
  dto.ImportMatch:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  dto.ImportOutcome:
    properties:
      key:
        type: string
      message:
        type: string
      name:
        type: string
      product_id:
        type: string
      status:
        description: created | updated | skipped | unchanged | failed
        type: string
    type: object
  dto.ImportPreview:
    properties:
      file_issues:
        description: Problems with the file as a whole (encoding, missing columns);
          nothing can be imported.
        items:
          $ref: '#/definitions/dto.ImportIssue'
        type: array
      products:
        items:
          $ref: '#/definitions/dto.ImportProduct'
        type: array
      summary:
        $ref: '#/definitions/dto.ImportSummary'
      warnings:
        items:
          type: string
        type: array
    type: object
  dto.ImportProduct:
    properties:
      changes:
        items:
          $ref: '#/definitions/dto.ImportChange'
        type: array
      existing:
        allOf:
        - $ref: '#/definitions/dto.ImportMatch'
        description: matched by slug, or the name match
      issues:
        items:
          $ref: '#/definitions/dto.ImportIssue'
        type: array
      key:
        type: string
      name:
        type: string
      new_skus:
        items:
          type: string
        type: array
      rows:
        items:
          type: integer
        type: array
      slug:
        type: string
      status:
        description: create | update | unchanged | name_match | error
        type: string
    type: object
  dto.ImportRequest:
    properties:
      csv:
        type: string
      filename:
        type: string
    type: object
  dto.ImportResult:
    properties:
      created:
        type: integer
      failed:
        type: integer
      outcomes:
        items:
          $ref: '#/definitions/dto.ImportOutcome'
        type: array
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  dto.ImportSummary:
    properties:
      create:
        type: integer
      errors:
        type: integer
      name_match:
        type: integer
      products:
        type: integer
      rows:
        type: integer
      unchanged:
        type: integer
      update:
        type: integer
    type: object
  dto.InstallmentCalculationOption:
    properties:
      bank_code:
        type: string
      bank_name:
        type: string
      interest_rate:
        type: integer
      monthly_pay_satang:
        type: integer
      months:
        type: integer
    type: object
  dto.InstallmentPlanDTO:
    properties:
      bank_code:
        description: KBANK, SCB, KRUNGSRI, BBL
        type: string
      bank_name:
        type: string
      interest_rate:
        type: integer
      monthly_pay_satang:
        type: integer
      months:
        description: 3, 6, 10
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LowStockItem:
    properties:
      available_stock:
        type: integer
      color_name:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      reserved_stock:
        type: integer
      sku:
        type: string
      stock_quantity:
        type: integer
      variant_id:
        type: string
    type: object
  dto.OrderLookupRequest:
    properties:
      email:
        type: string
      order_number:
        type: string
    type: object
  dto.PaymentProcessRequest:
    properties:
      card_cvv:
        type: string
      card_expiry:
        type: string
      card_holder_name:
        type: string
      card_number:
        type: string
      installment_plan:
        $ref: '#/definitions/dto.InstallmentPlanDTO'
      order_number:
        type: string
      payment_method:
        description: PROMPTPAY_QR, CREDIT_CARD, INSTALLMENT_0
        type: string
    type: object
  dto.ProductInput:
    properties:
      bento_highlights:
        type: object
      box_contents:
        type: object
      brand_id:
        type: string
      category_id:
        type: string
      full_spec_matrix:
        type: object
      is_active:
        type: boolean
      name:
        type: string
      ports_diagram:
        type: object
      short_description:
        type: string
      slug:
        description: generated from name when empty
        type: string
      tagline:
        type: string
      usage_personas:
        items:
          type: string
        type: array
      variants:
        items:
          $ref: '#/definitions/dto.VariantInput'
        type: array
    type: object
  dto.ProductReviews:
    properties:
      reviews:
        items:
          $ref: '#/definitions/dto.ReviewView'
        type: array
      summary:
        $ref: '#/definitions/dto.ReviewSummary'
      viewer:
        allOf:
        - $ref: '#/definitions/dto.ReviewViewer'
        description: nil for guests
    type: object
  dto.ProductStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.PromptPayQRResponse:
    properties:
      grand_total_satang:
        type: integer
      order_number:
        type: string
      promptpay_payload:
        type: string
      qr_code_data_url:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  dto.ReviewInput:
    properties:
      body:
        type: string
      rating:
        type: integer
      title:
        type: string
    type: object
  dto.ReviewMine:
    properties:
      body:
        type: string
      is_hidden:
        type: boolean
      rating:
        type: integer
      title:
        type: string
    type: object
  dto.ReviewSummary:
    properties:
      average:
        type: number
      count:
        type: integer
      distribution:
        items:
          type: integer
        type: array
    type: object
  dto.ReviewView:
    properties:
      author_name:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      rating:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ReviewViewer:
    properties:
      can_review:
        type: boolean
      my_review:
        $ref: '#/definitions/dto.ReviewMine'
    type: object
  dto.ReviewVisibility:
    properties:
      is_hidden:
        type: boolean
    type: object
  dto.SalesBreakdown:
    properties:
      key:
        type: string
      label:
        type: string
      orders:
        type: integer
      revenue_satang:
        type: integer
      units:
        type: integer
    type: object
  dto.SalesPeriod:
    properties:
      orders:
        type: integer
      revenue_satang:
        type: integer
      start:
        description: YYYY-MM-DD, store time
        type: string
      units:
        type: integer
    type: object
  dto.SalesReport:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.SalesBreakdown'
        type: array
      from:
        type: string
      group:
        description: day, week or month
        type: string
      payment_methods:
        items:
          $ref: '#/definitions/dto.SalesBreakdown'
        type: array
      previous:
        allOf:
        - $ref: '#/definitions/dto.SalesTotals'
        description: the same number of days just before From
      series:
        items:
          $ref: '#/definitions/dto.SalesPeriod'
        type: array
      to:
        type: string
      top_products:
        items:
          $ref: '#/definitions/dto.SalesBreakdown'
        type: array
      totals:
        $ref: '#/definitions/dto.SalesTotals'
    type: object
  dto.SalesTotals:
    properties:
      avg_order_satang:
        type: integer
      new_customer_orders:
        description: first paid order of that email
        type: integer
      orders:
        type: integer
      refunded_orders:
        description: paid, then cancelled by the store
        type: integer
      refunded_satang:
        type: integer
      revenue_satang:
        type: integer
      units:
        type: integer
    type: object
  dto.ShippingAddressDTO:
    properties:
      address_line_1:
        type: string
      address_line_2:
        type: string
      district:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      province:
        type: string
      recipient_name:
        type: string
    type: object
  dto.StockAdjustmentRequest:
    properties:
      expected_stock:
        type: integer
      mode:
        type: string
      note:
        type: string
      quantity:
        type: integer
      reason:
        type: string
    type: object
  dto.StockAdjustmentResponse:
    properties:
      available_stock:
        type: integer
      delta:
        type: integer
      reserved_stock:
        type: integer
      sku:
        type: string
      stock_quantity:
        type: integer
      variant_id:
        type: string
    type: object
  dto.StockAlertView:
    properties:
      created_at:
        type: string
      image:
        type: string
      price:
        type: integer
      product_name:
        type: string
      product_slug:
        type: string
      variant:
        type: string
      variant_id:
        type: string
    type: object
  dto.UpdateCartQuantityRequest:
    properties:
      quantity:
        type: integer
    type: object
  dto.UpdateOrderStatusRequest:
    properties:
      carrier:
        description: Carrier (KERRY, FLASH, DHL) and tracking number; required when
          moving to SHIPPED.
        type: string
      serial_numbers:
        additionalProperties:
          items:
            type: string
          type: array
        description: Order item ID -> one serial per unit. A blank entry keeps the
          saved serial for that unit.
        type: object
      status:
        description: PENDING_PAYMENT, PAID_PROCESSING, SN_ASSIGNED, SHIPPED, DELIVERED,
          CANCELLED
        type: string
      tracking_number:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      address:
        type: string
      full_name:
        type: string
      phone:
        type: string
    type: object
  dto.UploadResponse:
    properties:
      url:
        type: string
    type: object
  dto.UserDTO:
    properties:
      address:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  dto.VariantInput:
    properties:
      color_hex:
        type: string
      color_name:
        type: string
      compare_price:
        description: satang; 0 = none
        type: integer
      id:
        description: set to update an existing variant
        type: string
      images:
        items:
          type: string
        type: array
      initial_stock:
        description: new variants only
        type: integer
      price:
        description: satang
        type: integer
      sku:
        type: string
      specs:
        additionalProperties: true
        type: object
    type: object
  dto.WishlistToggleRequest:
    properties:
      product_id:
        type: string
    type: object
  dto.WishlistToggleResponse:
    properties:
      liked:
        type: boolean
      total_count:
        type: integer
    type: object
  models.AuditLog:
    properties:
      action:
        description: e.g. product.update
        type: string
      actor_email:
        type: string
      actor_id:
        type: string
      changes:
        description: '[]AuditChange'
        type: object
      created_at:
        type: string
      entity_id:
        type: string
      entity_label:
        description: name or number at the time
        type: string
      entity_type:
        description: product, order, banner, ...
        type: string
      id:
        type: string
    type: object
  models.Banner:
    properties:
      background_color:
        description: Hex or CSS radial/linear-gradient
        type: string
      badge_text:
        description: e.g., "NEW RELEASE", "0% 10 MONTHS"
        type: string
      created_at:
        type: string
      cta_primary_link:
        type: string
      cta_primary_text:
        type: string
      cta_secondary_link:
        type: string
      cta_secondary_text:
        type: string
      end_at:
        type: string
      grid_span:
        description: e.g., "col-span-2 row-span-2"
        type: string
      headline:
        description: e.g., "MacBook Pro 14 with M4 Pro"
        type: string
      id:
        type: string
      is_active:
        type: boolean
      placement:
        description: HERO_SPLIT (60%), BENTO_GRID (30%), TOP_RIBBON (10%)
        type: string
      product_image_url:
        description: Transparent PNG/WebP product cutout
        type: string
      sort_order:
        type: integer
      start_at:
        type: string
      subheadline:
        description: e.g., "Mind-blowing performance. Up to 24 hrs battery."
        type: string
      theme_mode:
        description: DARK (white text), LIGHT (dark text)
        type: string
    type: object
  models.Brand:
    properties:
      id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      slug:
        description: apple, asus, lenovo, dell, msi, lg, keychron
        type: string
    type: object
  models.Category:
    properties:
      icon_name:
        description: Lucide icon identifier
        type: string
      id:
        type: string
      name:
        type: string
      nav_label:
        description: short label in the top menu; empty keeps it out of the menu
        type: string
      slug:
        description: mac, ultrabooks, gaming-laptops, monitors, accessories
        type: string
      sort_order:
        type: integer
    type: object
  models.EmailMessage:
    properties:
      data:
        type: object
      id:
        type: string
      kind:
        type: string
      order_id:
        description: set for order emails
        type: string
      preheader:
        type: string
      recipient:
        type: string
      sender:
        type: string
      sent_at:
        type: string
      subject:
        type: string
      user_id:
        description: set for account emails
        type: string
    type: object
  models.Order:
    properties:
      allowed_transitions:
        description: filled for admin listings
        items:
          type: string
        type: array
      carrier:
        description: Shipment, recorded when the order moves to SHIPPED.
        type: string
      created_at:
        type: string
      customer_email:
        type: string
      delivered_at:
        type: string
      discount_amount:
        type: integer
      grand_total:
        type: integer
      guest_session_id:
        type: string
      id:
        type: string
      installment_plan:
        type: object
      items:
        items:
          $ref: '#/definitions/models.OrderItem'
        type: array
      order_number:
        description: 'Format: AURA-YYYYMMDD-XXXX'
        type: string
      payment_method:
        description: PROMPTPAY_QR, CREDIT_CARD, INSTALLMENT_0
        type: string
      reservation_expires_at:
        type: string
      shipped_at:
        type: string
      shipping_address:
        type: object
      status:
        description: PENDING_PAYMENT, PAID_PROCESSING, SN_ASSIGNED, SHIPPED, DELIVERED,
          CANCELLED
        type: string
      subtotal_amount:
        type: integer
      tracking_number:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      viewer_can_manage:
        description: |-
          ViewerCanManage is true when the requester placed the order and may pay for or cancel it.
          Someone who opened it through an order lookup (number + email) can only read it.
        type: boolean
    type: object
  models.OrderItem:
    properties:
      id:
        type: string
      name_snapshot:
        type: string
      order_id:
        type: string
      product_slug:
        description: ProductSlug links the line to its product page; filled for account
          order listings.
        type: string
      quantity:
        type: integer
      serial_numbers:
        description: |-
          One warranty serial per unit (index i = unit i+1). Every unit needs one before SHIPPED.
          Replaced the legacy single-value serial_number column (copied over, then dropped, on migration).
        items:
          type: string
        type: array
      sku_snapshot:
        type: string
      spec_summary:
        description: e.g., "Space Black / M4 Pro / 24GB / 512GB"
        type: string
      unit_price:
        type: integer
      variant_id:
        type: string
    type: object
  models.Product:
    properties:
      accessory_bundles:
        items:
          $ref: '#/definitions/models.ProductAccessoryBundle'
        type: array
      archived_at:
        description: |-
          ArchivedAt hides the product from the admin list (and from sale) without losing the
          orders and reports that refer to it. Nil for live products.
        type: string
      base_price:
        description: Lowest variant price in Satang
        type: integer
      bento_highlights:
        type: object
      box_contents:
        type: object
      brand:
        $ref: '#/definitions/models.Brand'
      brand_id:
        type: string
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      created_at:
        type: string
      full_spec_matrix:
        type: object
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      ports_diagram:
        type: object
      short_description:
        type: string
      slug:
        type: string
      tagline:
        type: string
      updated_at:
        type: string
      usage_personas:
        description: '["CREATOR", "GAMING", "ULTRALIGHT", "OFFICE"]'
        type: object
      variants:
        items:
          $ref: '#/definitions/models.ProductVariant'
        type: array
    type: object
  models.ProductAccessoryBundle:
    properties:
      accessory_product:
        $ref: '#/definitions/models.Product'
      accessory_product_id:
        type: string
      bundle_discount_pct:
        description: e.g., 10% off accessory when bought together
        type: integer
      id:
        type: string
      main_product_id:
        type: string
    type: object
  models.ProductVariant:
    properties:
      color_hex:
        description: e.g., "#2E2C2E"
        type: string
      color_name:
        description: e.g., "Space Black"
        type: string
      compare_price:
        description: Strikethrough price in Satang (optional)
        type: integer
      id:
        type: string
      images:
        description: '["url_front", "url_side", "url_open"]'
        type: object
      price:
        description: Exact price in Satang
        type: integer
      product:
        $ref: '#/definitions/models.Product'
      product_id:
        type: string
      reserved_stock:
        description: Soft-locked during 15m checkout
        type: integer
      sku:
        description: e.g., "MBP14-M4P-24-512-SB"
        type: string
      specs:
        type: object
      stock_quantity:
        type: integer
    type: object
  models.StockMovement:
    properties:
      actor_email:
        type: string
      actor_id:
        description: admin who made a manual change
        type: string
      created_at:
        type: string
      delta:
        description: signed change to stock_quantity
        type: integer
      id:
        type: string
      note:
        type: string
      order_id:
        description: order behind a SALE or CANCEL_RESTOCK
        type: string
      reason:
        type: string
      stock_after:
        description: stock_quantity after this change
        type: integer
      variant_id:
        type: string
    type: object
  models.Wishlist:
    properties:
      created_at:
        type: string
      guest_session_id:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/models.Product'
      product_id:
        type: string
      user_id:
        type: string
    type: object
  response.APIError:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        description: per-field problems, keyed by input path
        type: object
      message:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.APIError'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      facets: {}
      limit:
        type: integer
      page:
        description: 'Pagination counts are always sent: zero results is a real answer,
          not a missing field.'
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    REST API for the AURA Tech store: storefront, cart and checkout, customer accounts and the admin backoffice.
    Every response uses the same envelope: `{ success, data, meta, error }`. Amounts are in satang (1 baht = 100 satang).
    Guests are identified by the `X-Guest-Session-ID` header (the API issues one on the first request and returns it in the same header).
  title: AURA Tech API
  version: "1.0"
paths:
  /account/emails:
    get:
      description: Returns the 50 most recent emails sent to the signed-in customer,
        newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.EmailMessage'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List account emails
      tags:
      - Account
  /account/orders:
    get:
      description: Returns every order of the signed-in customer, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Order'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List my orders
      tags:
      - Account
  /account/stock-alerts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.StockAlertView'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List back-in-stock alerts
      tags:
      - Account
  /account/stock-alerts/{variantID}:
    delete:
      description: 'Returns `{ "message": string }`. Succeeds even when no alert was
        pending.'
      parameters:
      - description: Variant ID (UUID)
        in: path
        name: variantID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Malformed variant ID
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Product option not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Cancel a back-in-stock alert
      tags:
      - Account
    put:
      description: 'Emails the customer when the out-of-stock option is restocked.
        Subscribing again while an alert is pending has no effect. Returns `{ "message":
        string }`.'
      parameters:
      - description: Variant ID (UUID)
        in: path
        name: variantID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Malformed variant ID
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Product option not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: IN_STOCK
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Subscribe to a back-in-stock alert
      tags:
      - Account
  /admin/audit-logs:
    get:
      description: |-
        Returns a page of admin activity, newest first, with the before and after values of each change. `meta` carries page, limit, total_items and total_pages.
        Dates are store dates (Thailand time); `to` is inclusive. Invalid dates are ignored.
      parameters:
      - description: Record type, e.g. order, product, banner
        in: query
        name: type
        type: string
      - description: Admin email (partial match)
        in: query
        name: actor
        type: string
      - description: Search by record name or ID (partial match)
        in: query
        name: q
        type: string
      - description: Start date (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: End date, inclusive (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 30
        description: Page size (values outside 1-100 fall back to 30)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AuditLog'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List the activity log
      tags:
      - Admin · Activity
  /admin/banners:
    get:
      description: Returns every banner, including inactive and scheduled ones.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Banner'
                  type: array
              type: object
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List banners
      tags:
      - Admin · Banners
    post:
      consumes:
      - application/json
      description: Creates a home-page banner. start_at and end_at are RFC 3339. The
        change is written to the audit log.
      parameters:
      - description: Banner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.BannerInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Banner'
              type: object
        "400":
          description: Invalid body
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: 'VALIDATION_FAILED: per-field messages in error.fields'
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create a banner
      tags:
      - Admin · Banners
  /admin/banners/{id}:
    delete:
      description: Deletes the banner. The change is written to the audit log.
      parameters:
      - description: Banner ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Banner deleted.'
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  properties:
                    message:
                      type: string
                  type: object
              type: object
        "400":
          description: Malformed id
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Banner not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete a banner
      tags:
      - Admin · Banners
    put:
      consumes:
      - application/json
      description: Replaces the banner. Changed fields are written to the audit log.
      parameters:
      - description: Banner ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Banner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.BannerInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.Banner'
              type: object
        "400":
          description: Invalid body or malformed id
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Banner not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: 'VALIDATION_FAILED: per-field messages in error.fields'
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update a banner
      tags:
      - Admin · Banners
  /admin/banners/{id}/status:
    patch:
      consumes:
      - application/json
      description: Sets is_active and returns the new state. The change is written
        to the audit log.
      parameters:
      - description: Banner ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: New state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.BannerStatus'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.BannerStatus'
              type: object
        "400":
          description: Invalid body or malformed id
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 'UNAUTHORIZED: not signed in'
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: 'FORBIDDEN: signed in without the admin role'
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Banner not found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Turn a banner on or off
      tags:
      - Admin · Banners
  /admin/brands:
    get:
      description: Returns every brand with the number of products that carry it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
